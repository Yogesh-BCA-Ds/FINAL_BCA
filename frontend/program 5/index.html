<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body{font-family:Arial;background:#eee}
form{width:300px;margin:40px auto;padding:20px;background:white}
input,select,button{width:100%;padding:8px;margin:5px 0;box-sizing:border-box}
input[type=radio],input[type=checkbox]{width:auto}
p{color:red;font-size:13px;margin:2px}
button{background:green;color:white;border:0;cursor:pointer}
</style>
</head>
<body>
<form onsubmit="return validate()">
<h2>Registration Form</h2>
<label>Full Name</label>
<input id="name" placeholder="Enter your name">
<p id="n"></p>
<label>Email</label>
<input type="email" id="email" placeholder="Enter your email">
<p id="e"></p>
<label>Password</label>
<input type="password" id="pass" placeholder="Enter password">
<p id="p"></p>
<label>Gender</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<p id="g"></p>
<label>Course</label>
<select id="course">
<option value="">Select Course</option>
<option>BCA</option><option>BBA</option><option>B.Com</option>
</select>
<p id="c"></p>
<input type="checkbox" id="terms"> I agree to terms
<p id="t"></p>
<button type="submit">Register</button>
</form>
<script>
function validate(){
let n=name.value,e=email.value,p=pass.value,c=course.value,t=terms.checked,g=document.querySelector('input[name=gender]:checked'),ok=true;
["n","e","p","g","c","t"].forEach(x=>document.getElementById(x).innerHTML="");
if(!n) n.innerHTML="Name is required",ok=false;
else if(n.length<3)n.innerHTML="Name must be at least 3 characters",ok=false;
else if(!/^[A-Za-z ]+$/.test(n))document.getElementById("n").innerHTML="Name must contain only letters",ok=false;
if(!e)document.getElementById("e").innerHTML="Email is required",ok=false;
else if(!e.includes("@"))document.getElementById("e").innerHTML="Enter a valid email",ok=false;
if(!p)document.getElementById("p").innerHTML="Password is required",ok=false;
else if(p.length<6)document.getElementById("p").innerHTML="Password must be at least 6 characters",ok=false;
else if(!/[A-Z]/.test(p))document.getElementById("p").innerHTML="Password must contain one capital letter",ok=false;
else if(!/[0-9]/.test(p))document.getElementById("p").innerHTML="Password must contain one number",ok=false;
if(!g)document.getElementById("g").innerHTML="Please select gender",ok=false;
if(!c)document.getElementById("c").innerHTML="Please select a course",ok=false;
if(!t)document.getElementById("t").innerHTML="Please accept the terms",ok=false;
if(ok)alert("✓ Registration Successful!");
return false;
}
</script>
</body>
</html>
