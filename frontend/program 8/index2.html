<!DOCTYPE html> 
 <html>  
<head>  
    <title>Cartoon Gallery - Fetch API</title> 
     <style>  
    body {  
        font-family: Arial;  
        background: white;
        margin: 30px;  
        text-align: center;  
    }  

    button {  
        padding: 20x 40px;
        border: 0;  
        border-radius: 4;
        background: green;
        color: white;  
    }  

    #message {  
        font-weight: bold;  
        margin: 10px;
    }  

    #cartoons {  
        display: flex;  
        flex-wrap: wrap;  
        justify-content: center;  
        gap:10px
    }  

    .card {  
        width: 150;
        background: gold;
        padding: 24px;
        border-radius: 10px;  
        box-shadow: 0 4px 12px;
    }  

    .card img {  
        width: 100%;  
        height: 100px; 
        object-fit: cover;  
        border-radius: 50
    }  

    .card h3 {  
        margin: 10px 0;  
    }  
</style>

</head>  
<body>  
    <h1>Cartoon Gallery</h1> 
     <button onclick="loadCartoons()">Load Cartoons</button>

<p id="message">Click the button to load cartoons</p>  <div id="cartoons"></div>  <script>  
  
function loadCartoons() {  
  
    let message = document.querySelector("#message");  
    let cartoons = document.querySelector("#cartoons");  
  
    message.textContent = " Loading cartoons...";  
    cartoons.innerHTML = "";  
  
    fetch("https://raw.githubusercontent.com/samyak2403/daily-movies-api/main/movies/cartoons/cartoons.json")  
  
    .then(response => {  
  
        if (!response.ok)  
            throw new Error("Failed to load cartoon data");  
  
        return response.json();  
    })  
  
    .then(data => {  
  
        data.movies.forEach(cartoon => {  
  
            cartoons.innerHTML += `  
                <div class="card">
                    <h3>${cartoon.title}</h3>  
                </div>  
            `;  
        });  
  
        message.textContent =  
            `✅ ${data.movies.length} cartoons loaded`;  
    })  
  
    .catch(error => {  
  
        message.textContent = " " + error.message;  
    });  
}  
  
</script>  
</body>  
</html>
