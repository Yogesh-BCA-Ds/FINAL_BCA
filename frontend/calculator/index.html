<!DOCTYPE html>
<html>
    <head>
        <title>calculator</title>
        <script src="script.js"></script>
    </head>

    <body>
        <input type="text" id="i"><br>
        <button id="7" onclick="getValue()" value=7>7</button>
        <button id="8" onclick="getValue()" value=8>8</button>
        <button id="9" onclick="getValue()" value=9>9</button>
        <button id="/">/</button>
        <button id="auto">auto</button>
        <button id="on">on/ac</button> <br>
        <button id="4" onclick="getValue()" value=4>4</button>
        <button id="5" onclick="getValue()" value=5>5</button>
        <button id="6" onclick="getValue()" value=6>6</button>
        <button id="*">*</button>
        <button id="%">%</button>
        <button id="mrc">mrc</button> <br>
        <button onclick="getValue()" id="1" value=1>1</button>
        <button id="2" onclick="getValue()" value=2>2</button>
        <button id="3" onclick="getValue()" value=3>3</button>
        <button id="+">+</button>
        <button id="-">-</button>
        <button id="m-=">m-=</button> <br>
        <button id="0" onclick="getValue()" value="0">0</button>
        <button id="00" onclick="getValue()" value="00">00</button>
        <button id=".">.</button>
        <button id="null">null</button>
        <button id="=">=</button>
        <button id="m+=">m+=</button>
    </body>
    
</html>
