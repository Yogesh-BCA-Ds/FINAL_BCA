<!DOCTYPE html> 
<html> 
    <head> 
        <title>Calculator</title> 
        <script src="script.js" defer></script> 
        <link rel="stylesheet" href="style.css"> 
    </head> 
    <body>
<div id="container">

    <input type="text" id="i" readonly>

    <div id="buttons">

        <button id="7" onclick="getValue()" value="7">7</button>
        <button id="8" onclick="getValue()" value="8">8</button>
        <button id="9" onclick="getValue()" value="9">9</button>
        <button id="/" class="operator" onclick="getValue()" value="/">/</button>
        <button id="auto" onclick="autoCalculate()">auto</button>
        <button id="on" onclick="getValue()" value="clear">on/ac</button>

        <button id="4" onclick="getValue()" value="4">4</button>
        <button id="5" onclick="getValue()" value="5">5</button>
        <button id="6" onclick="getValue()" value="6">6</button>
        <button id="*" class="operator" onclick="getValue()" value="*">*</button>
        <button id="%" class="operator" onclick="getValue()" value="%">%</button>
        <button id="mrc" onclick="memoryRecall()">mrc</button>

        <button id="1" onclick="getValue()" value="1">1</button>
        <button id="2" onclick="getValue()" value="2">2</button>
        <button id="3" onclick="getValue()" value="3">3</button>
        <button id="+" class="operator" onclick="getValue()" value="+">+</button>
        <button id="-" class="operator" onclick="getValue()" value="-">-</button>
        <button id="m-=" onclick="memoryMinus()">m-=</button>

        <button id="0" onclick="getValue()" value="0">0</button>
        <button id="00" onclick="getValue()" value="00">00</button>
        <button id="." onclick="getValue()" value=".">.</button>
        <button id="c" onclick="getValue()" value="clear">clear</button>
        <button id="=" class="equal" onclick="getValue()" value="=">=</button>
        <button id="m+=" onclick="memoryPlus()">m+=</button>

    </div>

</div>

</body> </html>
